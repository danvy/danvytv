name: Deploy Astro site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Calculate semver from Git history and tags
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gv.outputs.majorMinorPatch }}
      major: ${{ steps.gv.outputs.major }}
      minor: ${{ steps.gv.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: "6.7.x"

      - name: Determine version
        id: gv
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Log version
        run: |
          echo "::notice title=Version::${{ steps.gv.outputs.majorMinorPatch }}"
          echo "## Version ${{ steps.gv.outputs.majorMinorPatch }}" >> $GITHUB_STEP_SUMMARY

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  # Tag the commit once version is known and the build succeeds
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push tag
        run: |
          TAG="v${{ needs.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
